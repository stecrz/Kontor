<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">

<body>
<div id="login" class="login hidden">
  <div class="card">
    <div class="brand"><svg width="30" height="30" viewBox="0 0 32 32"><rect x="2" y="2" width="28" height="28" rx="8" fill="var(--accent)"/><path d="M10 9v14M10 16l9-7M11 17l9 6" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Kontor</span></div>
    <div id="login-text" class="muted small"></div>
    <div id="tid-box" class="tid hidden">
      <svg class="tid-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 11v3a6 6 0 0 1-1.5 4"/><path d="M8.5 11.5a3.5 3.5 0 0 1 7 0v2.5a9 9 0 0 1-.9 4"/><path d="M5.5 15a12 12 0 0 0 .5-3.5 6 6 0 0 1 9-5.2"/><path d="M18 9.5a6 6 0 0 1 .5 2.5v2"/><path d="M4 9.5A8.5 8.5 0 0 1 12 3a8.5 8.5 0 0 1 8 5.5"/></svg>
      <button type="button" id="touchid-btn" data-i18n="btn_touchid">Mit Touch ID entsperren</button>
      <button type="button" id="pw-instead" class="ghost small" data-i18n="btn_pw_instead">Stattdessen Passwort eingeben</button>
    </div>
    <form id="login-form">
      <input id="login-pw" type="password" autocomplete="current-password" placeholder="Passwort" data-i18n-ph="passwort">
      <input id="login-pw2" type="password" autocomplete="new-password" placeholder="Passwort wiederholen" data-i18n-ph="ph_passwort_wiederholen" class="hidden">
      <label id="setup-tid" class="chk small hidden"><input type="checkbox" id="setup-tid-cb" checked> <span data-i18n="setup_touchid">Am Mac mit Touch ID entsperren (in den Einstellungen änderbar)</span></label>
      <button type="submit" id="login-btn" data-i18n="anmelden">Anmelden</button>
      <button type="button" id="tid-instead" class="ghost small hidden" data-i18n="btn_touchid">Mit Touch ID entsperren</button>
    </form>
    <div id="login-err" class="err"></div>
    <select class="lang-sel" id="lang-sel" aria-label="Sprache · Language" data-i18n-aria="sprache_label"></select>
  </div>
</div>
<div id="shell" class="shell hidden">

    <div class="brand"><svg width="22" height="22" viewBox="0 0 32 32"><rect x="2" y="2" width="28" height="28" rx="8" fill="var(--accent)"/><path d="M10 9v14M10 16l9-7M11 17l9 6" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Kontor</span><span class="ver" id="ver"></span></div>

      <a href="#steuer"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M3 2h10v12H3zM5 5h6v1H5zM5 8h6v1H5zM5 11h4v1H5z"/></svg><span data-i18n="steuer">Steuer</span></a>
      <a href="#umsaetze"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M3 1h7l3 3v11H3zM9 2v3h3zM5 8h6v1H5zM5 11h6v1H5z"/></svg><span data-i18n="umsaetze_belege">Umsätze &amp; Belege</span></a>
      <a href="#kategorien"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M2 2h5v5H2zM9 2h5v5H9zM2 9h5v5H2zM9 9h5v5H9z"/></svg><span data-i18n="kategorien">Kategorien</span></a>

      <a href="#regeln"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M2 3h12v2H2zM4 7h8v2H4zM6 11h4v2H6z"/></svg><span data-i18n="regeln">Regeln</span></a>

      <a href="#updates"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 2l4 4H9v4H7V6H4zM2 12h12v2H2z"/></svg><span data-i18n="updates">Updates</span></a>
      <a href="#protokoll"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M2 2h12v12H2zm2 2v2h8V4zm0 4v1h8V8zm0 3v1h5v-1z"/></svg><span data-i18n="protokoll">Protokoll</span></a>
      <a href="#hilfe"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 1a7 7 0 1 1 0 14A7 7 0 0 1 8 1zm0 10.5a1 1 0 1 0 0 2 1 1 0 0 0 0-2zM8 4a3 3 0 0 0-3 3h2a1 1 0 1 1 1.6.8C8 8.3 7 8.8 7 10h2c0-.6.6-.9 1.2-1.4A3 3 0 0 0 8 4z"/></svg><span data-i18n="hilfe">Hilfe</span></a>
    </nav>
    <div class="side-foot">
      <div id="status-mini"></div>
      <div class="side-btns"><button id="sync-btn" class="small" data-i18n="btn_synchronisieren">Synchronisieren</button><button id="lock-btn" class="secondary small" data-i18n="btn_sperren">Sperren</button></div>
    </div>
  </aside>
  <main>
    <header class="topbar">
      <button id="menu-btn" class="icon" aria-label="Menü" data-i18n-aria="aria_menu">☰</button>
      <h1 id="page-title">Übersicht</h1>
      <div id="bereich-seg" class="seg hidden"></div>
    </header>
    <div id="banner" class="banner hidden"></div>
    <section id="main"></section>
  </main>

<div id="drawer" class="drawer"></div>
<div id="toast" class="toast hidden"></div>
<input type="file" id="file-input" class="hidden" multiple>
