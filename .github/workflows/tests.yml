name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 2 * * *"          # nightly: many more random runs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.9"           # the Python of Apple's command line tools on the Mac (its Playwright needs an older image)
            os: ubuntu-24.04
          - python: "3.13"
            os: ubuntu-24.04          # not ubuntu-latest: on 26.04 the browser libraries come from a crawling mirror (17+ min)
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6        # any Python version on any runner (3.9 is gone from setup-python's newest images)
        with:
          python-version: ${{ matrix.python }}
          activate-environment: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Week
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      # the system packages for the browsers (up to ~150 MB) are most of the setup time and come from a mirror that crawls
      # now and then: keep the downloaded packages; a new week starts from last week's and adds only what changed
      - uses: actions/cache@v4
        with:
          path: ~/apt-cache
          key: apt-${{ matrix.os }}-py${{ matrix.python }}-${{ steps.week.outputs.week }}
          restore-keys: apt-${{ matrix.os }}-py${{ matrix.python }}-
      - name: Tools
        timeout-minutes: 30                 # usually 1-4 min, up to ~11 with retries; a stuck mirror must not hang the run
        run: |
          # apt keeps its downloads in the cached folder; a retry waits for the package lock instead of failing; nothing is
          # cut off from outside (apt-get would keep running and hold the lock) -- apt's own network limits and the step's
          # limit are enough; after four failed tries the step fails instead of going on without the tools
          mkdir -p ~/apt-cache/partial
          printf 'Dir::Cache::Archives "%s/apt-cache/";\nAPT::Keep-Downloaded-Packages "true";\nDPkg::Lock::Timeout "900";\n' "$HOME" \
            | sudo tee /etc/apt/apt.conf.d/90ci
          for i in 1 2 3 4; do sudo apt-get update -q && sudo apt-get install -y -q sqlcipher && break; [ $i = 4 ] && exit 1; sleep 30; done
          uv pip install -q pytest playwright pillow cryptography
          # WebKit (Safari's engine) on the newer runner: the tables' alignment as on the Mac
          for i in 1 2 3 4; do python -m playwright install --with-deps chromium ${{ matrix.python == '3.13' && 'webkit' || '' }} && break; [ $i = 4 ] && exit 1; sleep 30; done
          # readable for the cache upload at the end of the job (apt leaves root-only files behind)
          sudo rm -f ~/apt-cache/lock; sudo find ~/apt-cache/partial -mindepth 1 -delete; sudo chown -R "$(id -u):$(id -g)" ~/apt-cache
          echo "Packages kept: $(ls ~/apt-cache/*.deb 2>/dev/null | wc -l), $(du -sh ~/apt-cache | cut -f1)"
      - name: Interface
        run: node --check web/app.js && node --check web/i18n.js && node --check web/sw.js
      - name: Tests
        timeout-minutes: 30                 # today 4 min, nightly 7 min: room for many more tests
        env:
          KONTOR_FUZZ_SEEDS: ${{ github.event_name == 'schedule' && '1000' || '40' }}
          TZ: Europe/Berlin
        run: python -m pytest -q tests
