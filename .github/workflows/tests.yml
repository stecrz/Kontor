name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 2 * * *"          # nightly: many more random runs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]     # 3.9: the Python of Apple's command line tools on the Mac
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6        # any Python version on any runner (3.9 is gone from setup-python's newest images)
        with:
          python-version: ${{ matrix.python }}
          activate-environment: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Tools
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q sqlcipher
          uv pip install -q pytest playwright pillow cryptography
          python -m playwright install --with-deps chromium
      - name: Interface
        run: node --check web/app.js && node --check web/i18n.js && node --check web/sw.js
      - name: Tests
        env:
          KONTOR_FUZZ_SEEDS: ${{ github.event_name == 'schedule' && '1000' || '40' }}
          TZ: Europe/Berlin
        run: python -m pytest -q tests
