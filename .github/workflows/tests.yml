name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 2 * * *"          # nightly: many more random runs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.9"           # the Python of Apple's command line tools on the Mac (its Playwright needs an older image)
            os: ubuntu-24.04
          - python: "3.13"
            os: ubuntu-24.04          # not ubuntu-latest: on 26.04 the browser libraries come from a crawling mirror (17+ min)
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6        # any Python version on any runner (3.9 is gone from setup-python's newest images)
        with:
          python-version: ${{ matrix.python }}
          activate-environment: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Tools
        timeout-minutes: 30                 # usually 1-4 min, up to ~11 with retries; a stuck mirror must not hang the run
        run: |
          # the runners' package mirror fails or crawls now and then: a retry waits for the package lock instead of failing;
          # nothing is cut off from outside (apt-get would keep running and hold the lock) -- apt's own network limits and the
          # step's limit are enough
          echo 'DPkg::Lock::Timeout "900";' | sudo tee /etc/apt/apt.conf.d/90lock-timeout
          for i in 1 2 3 4; do sudo apt-get update -q && sudo apt-get install -y -q sqlcipher && break; sleep 30; done
          uv pip install -q pytest playwright pillow cryptography
          # WebKit (Safari's engine) on the newer runner: the tables' alignment as on the Mac
          for i in 1 2 3 4; do python -m playwright install --with-deps chromium ${{ matrix.python == '3.13' && 'webkit' || '' }} && break; sleep 30; done
      - name: Interface
        run: node --check web/app.js && node --check web/i18n.js && node --check web/sw.js
      - name: Tests
        timeout-minutes: 30                 # today 4 min, nightly 7 min: room for many more tests
        env:
          KONTOR_FUZZ_SEEDS: ${{ github.event_name == 'schedule' && '1000' || '40' }}
          TZ: Europe/Berlin
        run: python -m pytest -q tests
