name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 2 * * *"          # nightly: many more random runs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Python 3.9 (wie auf dem Mac) · Chrome"
            python: "3.9"           # the Python of Apple's command line tools on the Mac (its Playwright needs an older image)
            os: ubuntu-24.04
          - name: "Python 3.13 · Chrome + Safari-Engine · Code-Checks"
            python: "3.13"
            os: ubuntu-24.04          # not ubuntu-latest: on 26.04 the browser libraries come from a crawling mirror (17+ min)
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3   # any Python version on any runner (3.9 is gone from setup-python's newest images); no v10 tag
        with:
          python-version: ${{ matrix.python }}
          activate-environment: true
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"           # always the maintained version, only for node --check
      - name: Week
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      # the system packages for the browsers (up to ~150 MB) are most of the setup time and come from a mirror that crawls
      # now and then: keep the downloaded packages; a new week starts from last week's and adds only what changed
      - uses: actions/cache@v6
        with:
          path: ~/apt-cache
          key: apt-${{ matrix.os }}-py${{ matrix.python }}-${{ steps.week.outputs.week }}
          restore-keys: apt-${{ matrix.os }}-py${{ matrix.python }}-
      - name: Tools
        timeout-minutes: 30                 # usually 1-4 min, up to ~11 with retries; a stuck mirror must not hang the run
        run: |
          # apt keeps its downloads in the cached folder; a retry waits for the package lock instead of failing; nothing is
          # cut off from outside (apt-get would keep running and hold the lock) -- apt's own network limits and the step's
          # limit are enough; after four failed tries the step fails instead of going on without the tools
          mkdir -p ~/apt-cache/partial
          printf 'Dir::Cache::Archives "%s/apt-cache/";\nAPT::Keep-Downloaded-Packages "true";\nAPT::Sandbox::User "root";\nDPkg::Lock::Timeout "900";\n' "$HOME" \
            | sudo tee /etc/apt/apt.conf.d/90ci
          for i in 1 2 3 4; do sudo apt-get update -q && sudo apt-get install -y -q sqlcipher && break; [ $i = 4 ] && exit 1; sleep 30; done
          uv pip install -q pytest playwright pillow cryptography
          # WebKit (Safari's engine) on the newer runner: the tables' alignment as on the Mac
          for i in 1 2 3 4; do python -m playwright install --with-deps chromium ${{ matrix.python == '3.13' && 'webkit' || '' }} && break; [ $i = 4 ] && exit 1; sleep 30; done
          # only versions the server still offers (else the cache grows by every replaced version, week after week); readable for
          # the cache upload at the end of the job (apt leaves root-only files behind)
          sudo apt-get autoclean -q
          sudo rm -f ~/apt-cache/lock; sudo find ~/apt-cache/partial -mindepth 1 -delete; sudo chown -R "$(id -u):$(id -g)" ~/apt-cache
          echo "Packages kept: $(ls ~/apt-cache/*.deb 2>/dev/null | wc -l), $(du -sh ~/apt-cache | cut -f1)"
      - name: Interface
        run: node --check web/app.js && node --check web/i18n.js && node --check web/sw.js
      - name: Code checks
        if: matrix.python == '3.13'           # once is enough: unused and undefined names in Python and in the interface
        run: |
          uv pip install -q pyflakes
          python -m pyflakes *.py tests/*.py .claude/hooks/*.py
          npm install -s --no-save --no-package-lock eslint@9 globals
          npx --no-install eslint -c .github/eslint.config.mjs web
      - name: Tests
        timeout-minutes: 30                 # today 4 min, nightly 7 min: room for many more tests
        env:
          KONTOR_FUZZ_SEEDS: ${{ github.event_name == 'schedule' && '1000' || '40' }}
          TZ: Europe/Berlin
        run: python -m pytest -q tests

  # Kontor runs only on the Mac: what only a Mac can check -- Apple's own Python, the Swift helpers (Touch ID, balances from
  # MoneyMoney's database), the bridge to MoneyMoney, installing the background service. MoneyMoney itself is not there.
  mac:
    name: "macOS · Apples Python · Swift · MoneyMoney-Brücke · Installation"
    runs-on: macos-15
    timeout-minutes: 20
    env:
      PATH: /usr/bin:/bin:/usr/sbin:/sbin           # Apple's python3, swiftc, git -- not Homebrew's
    steps:
      - uses: actions/checkout@v7
      - name: Apple's Python
        run: |
          python3 --version
          python3 -m compileall -q -x '(^|/)(node_modules|\.git)/' .
          python3 -c "import kontor, service, core, rules, model, report, categorize, mm_categories, mm_bridge, mm_history, realestate, tax, receipts, storage, auth, updates, tls_cert, security_names, history_import, excel, i18n"
      - name: Swift helpers
        run: |
          swiftc -O -o "$RUNNER_TEMP/touchid" touchid.swift
          swiftc -O -o "$RUNNER_TEMP/mm_history" mm_history.swift
      - name: MoneyMoney bridge
        run: |
          osacompile -l JavaScript -o "$RUNNER_TEMP/mm_bridge.scpt" mm_bridge.jxa
          # transfers and direct debits stay blocked, before MoneyMoney is even asked
          for m in createBankTransfer createDirectDebit; do
            if out=$(osascript -l JavaScript mm_bridge.jxa "{\"method\":\"$m\",\"args\":null}" 2>&1); then echo "$m let through"; exit 1; fi
            echo "$out" | grep -q "nicht erlaubt" || { echo "unexpected: $out"; exit 1; }
          done
      - name: Install and service
        continue-on-error: true                     # new: watched for a few runs before it counts
        run: |
          # a keychain of its own for the data key (the runner's own one may ask); removed with the machine
          security create-keychain -p ci "$RUNNER_TEMP/ci.keychain-db"
          security set-keychain-settings "$RUNNER_TEMP/ci.keychain-db"
          security unlock-keychain -p ci "$RUNNER_TEMP/ci.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/ci.keychain-db"
          security default-keychain -d user -s "$RUNNER_TEMP/ci.keychain-db"
          bash install.sh < /dev/null
          curl -fsS -o /dev/null http://127.0.0.1:8765/ && echo "service answers"
          python3 kontor.py uninstall --yes
          ! curl -fsS -o /dev/null http://127.0.0.1:8765/ 2>/dev/null && echo "service gone"
