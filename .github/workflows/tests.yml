name: Tests

# every version, as it lands on main (no branches, no pull requests); the many random runs at night: nightly.yml
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # first and fast: the commits of a push are one version after another -- none lowers VERSION or drops a version of the
  # changelog (a push that got past the lock in .claude/hooks/guard.py turns red at once)
  chain:
    name: Versionskette
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0                  # the whole history: the commits before the push are compared too
      - name: Versions one after another
        run: python3 .claude/hooks/guard.py chain "${{ github.event.before }}" "${{ github.sha }}"

  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        # four parts per Python, each on a machine of its own (one after the other ~25 min, side by side ~8): the pages; the
        # assistant and the tour; the calculations with their random cases (few fixed ones here -- nightly.yml runs 1000 and
        # new ones every night); everything else -- a new test file lands in "everything else" by itself, nothing is left out
        include:
          - name: "Python 3.9 (wie auf dem Mac) · Chrome · Seiten"
            python: "3.9"           # the Python of Apple's command line tools on the Mac (its Playwright needs an older image)
            os: ubuntu-24.04
            tests: tests/test_e2e.py
          - name: "Python 3.9 (wie auf dem Mac) · Chrome · Assistent, Rundgang"
            python: "3.9"
            os: ubuntu-24.04
            tests: tests/test_assistant.py tests/test_assistant_eval.py tests/test_memory.py tests/test_tour.py
          - name: "Python 3.9 (wie auf dem Mac) · Chrome · Rechnen, Zufallsfälle"
            python: "3.9"
            os: ubuntu-24.04
            tests: tests/test_fuzz.py tests/test_cashflow.py tests/test_scenarios.py tests/test_worlds.py tests/test_rule_worlds.py tests/test_rules.py tests/test_categories.py
          - name: "Python 3.9 (wie auf dem Mac) · Chrome · Übrige"
            python: "3.9"
            os: ubuntu-24.04
            tests: tests --ignore=tests/test_e2e.py --ignore=tests/test_assistant.py --ignore=tests/test_assistant_eval.py --ignore=tests/test_memory.py --ignore=tests/test_tour.py --ignore=tests/test_fuzz.py --ignore=tests/test_cashflow.py --ignore=tests/test_scenarios.py --ignore=tests/test_worlds.py --ignore=tests/test_rule_worlds.py --ignore=tests/test_rules.py --ignore=tests/test_categories.py
          - name: "Python 3.15 · Chrome + Safari-Engine · Seiten"
            python: "3.15"
            os: ubuntu-24.04          # not ubuntu-latest: on 26.04 the browser libraries come from a crawling mirror (17+ min)
            tests: tests/test_e2e.py
          - name: "Python 3.15 · Chrome + Safari-Engine · Assistent, Rundgang"
            python: "3.15"
            os: ubuntu-24.04
            tests: tests/test_assistant.py tests/test_assistant_eval.py tests/test_memory.py tests/test_tour.py
          - name: "Python 3.15 · Chrome + Safari-Engine · Rechnen, Zufallsfälle"
            python: "3.15"
            os: ubuntu-24.04
            tests: tests/test_fuzz.py tests/test_cashflow.py tests/test_scenarios.py tests/test_worlds.py tests/test_rule_worlds.py tests/test_rules.py tests/test_categories.py
          - name: "Python 3.15 · Chrome + Safari-Engine · Übrige · Code-Checks"
            python: "3.15"
            os: ubuntu-24.04
            tests: tests --ignore=tests/test_e2e.py --ignore=tests/test_assistant.py --ignore=tests/test_assistant_eval.py --ignore=tests/test_memory.py --ignore=tests/test_tour.py --ignore=tests/test_fuzz.py --ignore=tests/test_cashflow.py --ignore=tests/test_scenarios.py --ignore=tests/test_worlds.py --ignore=tests/test_rule_worlds.py --ignore=tests/test_rules.py --ignore=tests/test_categories.py
            checks: true
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3   # any Python version on any runner (3.9 is gone from setup-python's newest images); no v10 tag
        with:
          python-version: ${{ matrix.python }}
          activate-environment: true
      - uses: actions/setup-node@v7
        if: matrix.checks
        with:
          node-version: "lts/*"           # the maintained version, for ESLint
      - name: Week
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      # the system packages for the browsers (up to ~150 MB) are most of the setup time and come from a mirror that crawls
      # now and then: keep the downloaded packages; a new week starts from last week's and adds only what changed
      - uses: actions/cache@v6
        with:
          path: ~/apt-cache
          key: apt-${{ matrix.os }}-py${{ matrix.python }}-${{ steps.week.outputs.week }}
          restore-keys: apt-${{ matrix.os }}-py${{ matrix.python }}-
      - name: Tools
        timeout-minutes: 30                 # usually 1-4 min, up to ~11 with retries; a stuck mirror must not hang the run
        run: |
          # apt keeps its downloads in the cached folder; a retry waits for the package lock instead of failing; nothing is
          # cut off from outside (apt-get would keep running and hold the lock) -- apt's own network limits and the step's
          # limit are enough; after four failed tries the step fails instead of going on without the tools
          mkdir -p ~/apt-cache/partial
          printf 'Dir::Cache::Archives "%s/apt-cache/";\nAPT::Keep-Downloaded-Packages "true";\nAPT::Sandbox::User "root";\nDPkg::Lock::Timeout "900";\n' "$HOME" \
            | sudo tee /etc/apt/apt.conf.d/90ci
          for i in 1 2 3 4; do sudo apt-get update -q && sudo apt-get install -y -q sqlcipher && break; [ $i = 4 ] && exit 1; sleep 30; done
          uv pip install -q pytest playwright cryptography      # cryptography: MoneyMoney's database in the tests (the Mac has its own)
          # WebKit (Safari's engine) on the newer runner: the tables' alignment as on the Mac
          for i in 1 2 3 4; do python -m playwright install --with-deps chromium ${{ matrix.python == '3.15' && 'webkit' || '' }} && break; [ $i = 4 ] && exit 1; sleep 30; done
          # only versions the server still offers (else the cache grows by every replaced version, week after week); readable for
          # the cache upload at the end of the job (apt leaves root-only files behind)
          sudo apt-get autoclean -q
          sudo rm -f ~/apt-cache/lock; sudo find ~/apt-cache/partial -mindepth 1 -delete; sudo chown -R "$(id -u):$(id -g)" ~/apt-cache
          echo "Packages kept: $(ls ~/apt-cache/*.deb 2>/dev/null | wc -l), $(du -sh ~/apt-cache | cut -f1)"
      - name: Code checks
        if: matrix.checks                     # once is enough: syntax, unused and undefined names in Python and in the interface
        run: |
          uv pip install -q pyflakes
          python -m pyflakes *.py tests/*.py .claude/hooks/*.py
          npm install -s --no-save --no-package-lock eslint@9 globals
          npx --no-install eslint -c .github/eslint.config.mjs web
      - name: A real build of Python (tests of Kontor's own Python start the service in it; python-build-standalone, checked)
        if: ${{ !endsWith(matrix.tests, 'test_e2e.py') }}
        run: |
          # the same version Kontor names for the Mac (pyruntime.py), built for this machine; not there: that test is skipped
          f="cpython-3.15.2+20261110-x86_64-unknown-linux-gnu-install_only_stripped.tar.gz"
          for i in 1 2 3; do curl -fsSL -o "$RUNNER_TEMP/$f" "https://github.com/astral-sh/python-build-standalone/releases/download/20261110/${f/+/%2B}" && break; sleep 10; done
          if echo "ad23d1b73fac26440b0306ae06911031344c49a90ec19716c8362e7fa40cae43  $RUNNER_TEMP/$f" | sha256sum -c -; then
            echo "KONTOR_PYTHON_ARCHIVE=$RUNNER_TEMP/$f" >> "$GITHUB_ENV"
          fi
      - name: Tests
        timeout-minutes: 30                 # a few minutes per part: room for many more tests
        env:
          TZ: Europe/Berlin
          KONTOR_FUZZ_SEEDS: "12"      # few fixed random cases per push (and all found before): the nightly run checks 1000 and new ones
        run: python -m pytest -q -rs --durations=10 ${{ matrix.tests }}       # -rs: what was skipped, and why; then the slowest tests

  # Kontor runs only on the Mac: what only a Mac can check -- Apple's own Python and Kontor's own (the build it names, really
  # loaded: checked, tried, switched to, damaged, updated to from the version before), the Swift helpers (Touch ID,
  # balances from MoneyMoney's database), Kontor's own app, the bridge to MoneyMoney, installing the background service.
  # MoneyMoney itself is not there.
  mac:
    name: "macOS · Apples Python und Kontors eigenes · Swift · Mac-App · MoneyMoney-Brücke · Installation"
    runs-on: macos-15
    timeout-minutes: 40
    env:
      PATH: /usr/bin:/bin:/usr/sbin:/sbin           # Apple's python3, swiftc, git -- not Homebrew's
    steps:
      - uses: actions/checkout@v7
      - name: Apple's Python
        run: |
          python3 --version
          python3 -m compileall -q -x '(^|/)(node_modules|\.git)/' .
          python3 -c "import glob, importlib; [importlib.import_module(f[:-3]) for f in sorted(glob.glob('*.py'))]"   # every module, new ones too
      - name: Internet reader in the sandbox
        run: |
          # the assistant's reader process starts inside its sandbox profile and refuses a host it was not given (no network used)
          python3 -c "import tempfile, web_search as W; r = W.Reader(tempfile.mkdtemp(), lambda: 'strict'); assert r.command()[0] == W.SANDBOX; out = r({'url': 'https://example.org/x', 'hosts': ['de.wikipedia.org'], 'as': 'json', 'timeout': 5}); print(out); assert out == {'ok': False, 'error': 'host'}, out"
      - name: Model and reader in the sandbox (own temporary folder; never Kontor's, never the compilers' modules)
        run: |
          python3 - <<'EOF'
          import os, shutil, subprocess as S, tempfile
          import llm_local as L, web_search as W
          os.environ["TMPDIR"] = S.run(["getconf", "DARWIN_USER_TEMP_DIR"], capture_output=True, text=True).stdout.strip()
          tempfile.tempdir = None
          d = os.path.realpath(tempfile.mkdtemp()); os.makedirs(d + "/assistant/runtime")
          x = shutil.copy("/usr/bin/touch", d + "/assistant/runtime/touch")          # "strict" starts only programs of the runtime folder
          own, mine = L.own_tmp(), os.path.realpath(tempfile.mkdtemp(prefix="kontor-"))
          c = os.path.realpath(S.run(["getconf", "DARWIN_USER_CACHE_DIR"], capture_output=True, text=True).stdout.strip())
          os.makedirs(c + "/clang", exist_ok=True)
          t = lambda lv, f: S.run(["/usr/bin/sandbox-exec", "-p", L.sandbox_profile(d, d + "-prog", d + "/assistant", lv), x, f]).returncode == 0
          assert t("strict", own + "/ok") and t("strict", c + "/llm-run-ok") and t("basic", os.path.dirname(own) + "/llm-run-ok"), "allowed"
          assert not any(t(lv, f) for lv in ("strict", "basic") for f in (mine + "/no", own + "/kontor-x")), "kontor-"
          assert not t("strict", os.path.dirname(own) + "/llm-run-no") and not t("strict", c + "/clang/llm-run-no"), "strict"
          r = lambda f: S.run(["/usr/bin/sandbox-exec", "-p", W.reader_profile(d), W.python_exe(), "-I", "-S", "-c", "open(%r, 'w').close()" % f]).returncode == 0
          assert r(os.path.dirname(own) + "/reader-ok"), "reader: its temporary files"
          assert not r(mine + "/no") and not r(c + "/clang/no"), "reader"
          assert not os.path.exists(mine + "/no")
          print("ok")
          EOF
      - name: Model's sandbox over a socket file instead of 127.0.0.1 (a probe with the real llama.cpp; read by hand)
        continue-on-error: true           # new (it only reports): what macOS answers decides how Kontor shuts the model in next
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}   # GitHub answers a runner without a name only now and then (asked for the newest llama.cpp)
        run: python3 -u tests/mac_sandbox_probe.py
      - name: Swift helpers
        run: |
          swiftc -O -o "$RUNNER_TEMP/touchid" touchid.swift
          swiftc -O -o "$RUNNER_TEMP/mm_history" mm_history.swift
      - name: Data key (openssl over a pipe, Touch ID's answer wrapped in Swift, unwrapped in Python)
        run: |
          python3 - <<'EOF'
          import base64, os, secrets, subprocess, storage, auth
          k = os.urandom(32)
          assert storage.decrypt(k, storage.encrypt(k, b"x")) == b"x"
          assert storage._pass_mode() == "fd", storage._pass_mode()       # Apple's openssl reads the secret from a pipe
          helper = os.path.join(os.environ["RUNNER_TEMP"], "touchid")
          for _ in range(20):
              kek, mine, nonce = os.urandom(32), secrets.token_bytes(32), secrets.token_hex(16)
              pub = base64.b64encode(auth._x25519(mine, (9).to_bytes(32, "little"))).decode()
              out = subprocess.run([helper, "--transport-check", kek.hex(), pub, nonce], capture_output=True, text=True, timeout=30).stdout.strip()
              assert auth._unwrap_transport(mine, nonce, "ok %s %s" % (nonce, out)) == kek, out
              bad = out[:-1] + ("0" if out[-1] != "0" else "1")
              assert auth._unwrap_transport(mine, nonce, "ok %s %s" % (nonce, bad)) is None
          r = subprocess.run([helper, "--create"], capture_output=True, text=True, timeout=30)    # a VM has no Secure Enclave: says so
          print("create:", r.returncode, len(r.stdout))
          assert r.returncode in (0, 2)
          print("ok")
          EOF
      - name: Kontor's own app
        run: |
          python3 -c "import mac_app, sys; r = mac_app.build(force=True); print(r); sys.exit(r != 'ok')"
          codesign --verify --deep --strict Kontor.app
          plutil -lint Kontor.app/Contents/Info.plist Kontor.app/Contents/Resources/*.lproj/InfoPlist.strings
          test -s Kontor.app/Contents/Resources/AppIcon.icns
          python3 -c "import mac_app; assert mac_app.build() == 'ok' and mac_app.ready()"     # built once: not again (macOS would ask again)
      - name: Pages in macOS's WebKit, the Mac app's engine (a real right click selects the word under the pointer there)
        run: python3 tests/test_mac_webview.py -v
      - name: Receipt reader (text of a PDF and a picture, in its sandbox)
        run: |
          python3 - <<'EOF'
          import tempfile
          import receipt_text as R
          # a made-up one-page receipt with a text layer, offsets counted for its table
          body = b"BT /F1 18 Tf 20 100 Td (Gesamtbetrag 114,99 EUR) Tj ET"
          objs = [b"<</Type/Catalog/Pages 2 0 R>>", b"<</Type/Pages/Kids[3 0 R]/Count 1>>",
                  b"<</Type/Page/Parent 2 0 R/MediaBox[0 0 300 200]/Contents 4 0 R/Resources<</Font<</F1 5 0 R>>>>>>",
                  b"<</Length %d>>stream\n" % len(body) + body + b"\nendstream", b"<</Type/Font/Subtype/Type1/BaseFont/Helvetica>>"]
          pdf, offs = b"%PDF-1.4\n", []
          for i, o in enumerate(objs, 1):
              offs.append(len(pdf)); pdf += b"%d 0 obj" % i + o + b"\nendobj\n"
          xref = len(pdf)
          pdf += b"xref\n0 %d\n0000000000 65535 f \n" % (len(objs) + 1) + b"".join(b"%010d 00000 n \n" % x for x in offs)
          pdf += b"trailer<</Size %d/Root 1 0 R>>\nstartxref\n%d\n%%%%EOF\n" % (len(objs) + 1, xref)
          out = R.text_of(pdf, tempfile.mkdtemp())
          print(out)
          assert out["how"] == "pdf" and "114,99" in out["text"], out
          assert R.read_fields(out["text"])["total"] == 114.99
          # the same receipt as a picture: Apple's text recognition, in the same sandbox
          import os, subprocess
          body2 = b"BT /F1 54 Tf 20 80 Td (Gesamtbetrag 114,99 EUR) Tj ET"
          objs[2] = objs[2].replace(b"[0 0 300 200]", b"[0 0 900 200]"); objs[3] = b"<</Length %d>>stream\n" % len(body2) + body2 + b"\nendstream"
          pdf2, offs = b"%PDF-1.4\n", []
          for i, o in enumerate(objs, 1):
              offs.append(len(pdf2)); pdf2 += b"%d 0 obj" % i + o + b"\nendobj\n"
          xref = len(pdf2)
          pdf2 += b"xref\n0 %d\n0000000000 65535 f \n" % (len(objs) + 1) + b"".join(b"%010d 00000 n \n" % x for x in offs)
          pdf2 += b"trailer<</Size %d/Root 1 0 R>>\nstartxref\n%d\n%%%%EOF\n" % (len(objs) + 1, xref)
          d = tempfile.mkdtemp(); open(os.path.join(d, "r.pdf"), "wb").write(pdf2)
          subprocess.run(["sips", "-s", "format", "png", os.path.join(d, "r.pdf"), "--out", os.path.join(d, "r.png")], check=True, capture_output=True)
          png = open(os.path.join(d, "r.png"), "rb").read()
          out = R.text_of(png, tempfile.mkdtemp())
          print(out)
          if "114,99" not in out["text"].replace(" ", ""):      # what the helper reads outside the sandbox: says whether the sandbox is the cause
              print("without sandbox:", subprocess.run([R._helper()], input=png, capture_output=True).stdout[:300])
          assert out["how"] == "ocr" and "114,99" in out["text"].replace(" ", ""), out
          # its sandbox: writes into its own folder of the run, never into Kontor's temporary folders (kontor-...)
          work, mine = tempfile.mkdtemp(prefix="rcpt-"), tempfile.mkdtemp(prefix="kontor-")
          R.HELPER_BIN = "/usr/bin/touch"
          prof = R._profile(os.path.expanduser("~"), tempfile.mkdtemp(), work)
          assert subprocess.run(["/usr/bin/sandbox-exec", "-p", prof, "/usr/bin/touch", os.path.join(work, "ok")]).returncode == 0
          assert subprocess.run(["/usr/bin/sandbox-exec", "-p", prof, "/usr/bin/touch", os.path.join(mine, "no")]).returncode != 0
          assert not os.path.exists(os.path.join(mine, "no"))
          EOF
      - name: Tables in PDFs and pictures (the helper's words and places, in its sandbox)
        run: |
          # made-up statements over several pages: PDFKit's text and Apple's text recognition must give the same tables as the rules expect
          python3 tests/test_pdf_tables.py -v OnMac
      - name: MoneyMoney bridge
        run: |
          osacompile -l JavaScript -o "$RUNNER_TEMP/mm_bridge.scpt" mm_bridge.jxa
          # transfers and direct debits stay blocked, before MoneyMoney is even asked
          for m in createBankTransfer createDirectDebit; do
            if out=$(osascript -l JavaScript mm_bridge.jxa "{\"method\":\"$m\",\"args\":null}" 2>&1); then echo "$m let through"; exit 1; fi
            echo "$out" | grep -q "nicht erlaubt" || { echo "unexpected: $out"; exit 1; }
          done
          # a transaction's comment (anything but its category) stays blocked too
          if out=$(osascript -l JavaScript mm_bridge.jxa '{"method":"setTransaction","args":{"id":1,"commentTo":"x"}}' 2>&1); then echo "comment let through"; exit 1; fi
          echo "$out" | grep -q "Angabe nicht erlaubt" || { echo "unexpected: $out"; exit 1; }
      - name: Kontor's own Python (the build Kontor names, from GitHub -- a wrong file refused; made runnable; tried)
        timeout-minutes: 10
        run: python3 tests/mac_python.py build
      - name: The same parts in Kontor's own Python (every part of Kontor, the reader in its sandbox, https, the data key)
        timeout-minutes: 10
        run: python3 tests/mac_python.py parts "$(cat "$RUNNER_TEMP/kontor-python")"
      - name: Install and service
        run: |
          bash install.sh < /dev/null           # a new installation: with Kontor's own Python from its first start
          curl -fsS -o /dev/null http://127.0.0.1:8765/ && echo "service answers"
          # the app shows Kontor, as an app: the page sees the app (and the app's name in the browser's name), the app has the
          # words of its menu, its commands with their keys (Find works through the menu) and the theme from the page, the page's
          # printing and Dock badge go to the app; no title bar of its
          # own (clicks in the strip at the top reach the page -- else the app would keep its title bar), its buttons where macOS
          # puts them: as close to the top edge as to the left one
          out=$(Kontor.app/Contents/MacOS/Kontor --check http://127.0.0.1:8765/) && echo "$out"
          echo "$out" | python3 -c "import json, sys; d = json.load(sys.stdin); assert d['title'] == 'Kontor' and d['bridge'] and d['shell'] and d['app'] and d['agent'] and d['print'] and d['badge'] and d['dark'], d; assert d['capture'] in ('stream', 'NotFoundError') if d['mic'] == 'granted' else d['capture'] == 'NotAllowedError', d; assert d['menu'] == ['Kontor', 'Ablage', 'Bearbeiten', 'Darstellung', 'Fenster', 'Hilfe'], d; assert d['chrome']['full'] and d['chrome']['band'] > 0 and 0 <= d['chrome']['top'] < 20 and abs(d['chrome']['top'] - d['chrome']['left']) <= 4 and d['chrome']['middle'] < 26, d; assert ['Mit MoneyMoney abgleichen', '⇧r'] in d['commands'] and ['Suchen …', 'f'] in d['commands'] and ['Rückwärts suchen', '⇧g'] in d['commands'], d; assert d['reload'] == 'r' and d['findBar'], d"
          ! Kontor.app/Contents/MacOS/Kontor --check http://127.0.0.1:8766/ && echo "another address refused"
          echo "installed: $(cat VERSION)"
      - name: Kontor's own Python in the installed service (started anew by launchd, damaged, tried again)
        timeout-minutes: 15
        run: python3 tests/mac_python.py service
      - name: Uninstall from the page while Kontor runs in its own Python (everything gone, that Python too)
        timeout-minutes: 5
        run: |
          test -d .python                       # (there until now)
          python3 tests/mac_python.py uninstall
          if curl -fsS -o /dev/null http://127.0.0.1:8765/ 2>/dev/null; then echo "the service still answers"; exit 1; fi
          test ! -e .python && test -f kontor.py
          echo "everything gone"
      - name: Update from the version before (an installation of it gets this version over its own update, then Kontor's own Python)
        if: ${{ github.event.before != '' && github.event.before != '0000000000000000000000000000000000000000' }}
        continue-on-error: true           # new (3.17.12): watched for a few versions, then it counts like every step
        timeout-minutes: 15
        run: |
          OLD="$HOME/Applications/Kontor"
          git clone --quiet --depth 20 "https://github.com/$GITHUB_REPOSITORY.git" "$OLD"
          git -C "$OLD" checkout --quiet -B main "${{ github.event.before }}"
          echo "installing $(cat "$OLD/VERSION") ($(git -C "$OLD" rev-parse --short HEAD))"
          KONTOR_PYTHON=apple python3 "$OLD/kontor.py" install < /dev/null
          python3 tests/mac_python.py update "$OLD"
          # removed in the terminal (the password asked for there comes from the pipe: this machine has no terminal), with the program folder
          printf 'nur-ein-test-passwort\n' | python3 "$OLD/kontor.py" uninstall --yes --program
          if pgrep -f "kontor.py --quiet start"; then echo "a process is left"; exit 1; fi
          test ! -e "$OLD/.python"
          test ! -e "$OLD/kontor.py"
          echo "everything gone"
