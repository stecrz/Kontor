name: Nachtstart

# Starts the night (nightly.yml, "Zufallsläufe") between 3 and 4 a.m. German time, summer and winter (the user, 2026-11-26).
# GitHub starts scheduled runs late under load -- in this repository 7-9 hours (Nov. 2026: 3:47 planned, 12:29 started); a run
# started with workflow_dispatch is not delayed. So this wakes every two hours, each wake-up as late as GitHub makes it: the
# first within 2 h 45 min before 3:05 waits and starts the night, the others end in seconds (.github/night_start.py;
# tests/test_workflows.py, NightStart). One at a time (`concurrency`): while one waits, the next queues, then sees the night
# started. By hand ("Run workflow") it does the same -- it never starts the night by day.
on:
  schedule:
    - cron: "13 */2 * * *"          # every two hours, off the full hour (GitHub is busiest there); in UTC, the script counts German time
  workflow_dispatch:

permissions:
  actions: write                    # to start nightly.yml: a workflow_dispatch by the run's own token does start a run
  contents: read

concurrency:
  group: night-start
  cancel-in-progress: false

jobs:
  start:
    name: Nachtlauf um 3 Uhr starten
    runs-on: ubuntu-24.04
    timeout-minutes: 175            # the longest wait (2 h 45 min) and three tries to start
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github
      - run: python3 .github/night_start.py
        env:
          GH_TOKEN: ${{ github.token }}
