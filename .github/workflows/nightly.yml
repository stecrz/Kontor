name: Nachtlauf
run-name: ${{ github.event_name == 'schedule' && 'Wecker (startet den Nachtlauf um 3 Uhr)' || 'Nachtlauf' }}

# The night: every night between 3 and 4 a.m. German time, summer and winter (the user, 2026-11-26/27), on the newest main; the
# tests of every version: tests.yml. Two kinds of run in this one workflow:
# - "Wecker" (schedule, every two hours): GitHub starts scheduled runs here hours late and now and then not at all, a run by
#   workflow_dispatch at once. The first wake-up within 5 1/2 hours before 3:05 waits and starts the night (this workflow, by
#   workflow_dispatch); the others end in seconds (.github/nightly.py; tests/test_workflows.py, Night, plays every delay through).
# - "Nachtlauf" (workflow_dispatch, by the wake-up or by hand with "Run workflow" -- then at once): as many random cases as fit.
#   Each job first the fixed cases (the first job of a test the 1000 fixed ones, instead of 12 per push) and those found before
#   (tests/fixtures.py, FOUND), then new ones drawn anew each night until its time is up (KONTOR_FUZZ_MINUTES; the run's summary
#   shows how many). Each random test takes that whole time from when it begins, so every job runs exactly one of them (two in a
#   file: one job each, picked with -k) -- the cash flow's file has two, both in one job ran past the job's limit and GitHub
#   cancelled it night after night (until 3.17.80; tests/test_workflows.py, NightJobs, holds it). The booking rules are slowest
#   per case: several machines side by side. The click paths (tests/test_clickpaths.py: pages, dialogs, side windows and
#   references in a changing order, light and dark, Mac and iPhone, on changing worlds) walk in Chromium and Safari's engine: 40
#   fixed walks and their found ones (FOUND_CLICKS), then new ones -- only here, not per push. The data worlds
#   (tests/data_worlds.py: long names, large amounts, empty and full areas, other currencies, month and year ends) go through the
#   whole service -- figures, requests, the assistant; and every page in Chrome, each fixed world in every view, new random worlds
#   after them. A failure names its case: KONTOR_FUZZ_SEED=<number> runs it again. About 3 hours, well under the user's limit
#   of 5; red: the next chat fixes it ("fix nightly", CLAUDE.md).
on:
  schedule:
    - cron: "13 */2 * * *"          # the wake-ups, every two hours, off the full hour (GitHub is busiest there); UTC -- the script counts German time
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wake:
    name: Wecker – startet den Nachtlauf um 3 Uhr
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 350            # the longest wait (5 h 30 min) and the tries to start; GitHub ends a job after six hours
    permissions:
      actions: write                # to start the night: a workflow_dispatch by the run's own token does start a run
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github
      - run: python3 .github/nightly.py
        env:
          GH_TOKEN: ${{ github.token }}

  fuzz:
    name: ${{ matrix.name }}
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 240              # the cases stop after KONTOR_FUZZ_MINUTES (plus the fixed ones); this only catches a hang
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: "Buchungsregeln 1 · feste + neue Fälle", tests: tests/test_fuzz.py, fixed: "1000"}
          - {name: "Buchungsregeln 2 · neue Fälle", tests: tests/test_fuzz.py, fixed: "0"}
          - {name: "Buchungsregeln 3 · neue Fälle", tests: tests/test_fuzz.py, fixed: "0"}
          - {name: "Buchungsregeln 4 · neue Fälle", tests: tests/test_fuzz.py, fixed: "0"}
          - {name: "Cashflow · feste + neue Fälle", tests: "tests/test_cashflow.py -k 'not random_plans'", fixed: "1000"}
          - {name: "Planung · feste + neue Fälle", tests: "tests/test_cashflow.py -k random_plans", fixed: "1000"}
          - {name: "Szenarien · feste + neue Fälle", tests: tests/test_scenarios.py, fixed: "1000"}
          - {name: "Welten (Privatpersonen, Firmen, Beteiligungen) · feste + neue Fälle", tests: tests/test_worlds.py, fixed: "1000"}
          - {name: "Regelwelten (Beteiligung, Darlehen, Kontenspiegel) 1 · feste + neue Fälle", tests: tests/test_rule_worlds.py, fixed: "1000"}
          - {name: "Regelwelten (Beteiligung, Darlehen, Kontenspiegel) 2 · neue Fälle", tests: tests/test_rule_worlds.py, fixed: "0"}
          - {name: "Klickpfade (Seiten, Dialoge, Seitenfenster, Bezüge) 1 · feste + neue Fälle", tests: tests/test_clickpaths.py, fixed: "40", browsers: true}
          - {name: "Klickpfade (Seiten, Dialoge, Seitenfenster, Bezüge) 2 · neue Fälle", tests: tests/test_clickpaths.py, fixed: "0", browsers: true}
          - {name: "Datenwelten · Zahlen, Anfragen, Assistent · feste + neue Fälle", tests: "tests/test_data_worlds.py -k 'not Pages'", fixed: "0"}
          - {name: "Datenwelten · Seiten in Chrome · feste + neue Fälle", tests: "tests/test_data_worlds.py -k Pages", fixed: "0", browsers: true, minutes: "150"}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.15"          # Kontor's own Python (Apple's 3.9 only starts the starter)
          activate-environment: true
      - run: uv pip install -q pytest
      - name: "Browsers (the click paths: Chromium and WebKit, Safari’s engine)"
        if: matrix.browsers
        timeout-minutes: 30                 # a stuck mirror must not hang the night
        run: |
          uv pip install -q playwright
          for i in 1 2 3 4; do python -m playwright install --with-deps chromium webkit && break; [ $i = 4 ] && exit 1; sleep 30; done
      - name: Tests
        env:
          KONTOR_FUZZ_SEEDS: ${{ matrix.fixed }}
          KONTOR_CLICK_SEEDS: ${{ matrix.fixed }}
          KONTOR_FUZZ_MINUTES: ${{ matrix.minutes || '170' }}       # the data worlds' pages: their fixed worlds in every view first (~20 min)
          TZ: Europe/Berlin
        run: |
          echo "### ${{ matrix.name }}" >> "$GITHUB_STEP_SUMMARY"
          python -m pytest -q ${{ matrix.tests }}
