name: Zufallsläufe

# every night on the newest main, as many random cases as fit: each job first the fixed cases (the first job of a test the
# 1000 fixed ones, instead of 40 per push) and those found before (tests/fixtures.py, FOUND), then new ones drawn anew each
# night until its time is up (KONTOR_FUZZ_MINUTES; the run's summary shows how many). Each random test takes that whole time
# from when it begins, so every job runs exactly one of them (two in a file: one job each, picked with -k) -- the cash flow's
# file has two, both in one job ran past the job's limit and GitHub cancelled it night after night (until 3.17.80;
# tests/test_workflows.py, NightJobs, holds it). The booking rules are slowest per case:
# several machines side by side. The click paths (tests/test_clickpaths.py: pages, dialogs, side windows and references in a
# changing order, light and dark, Mac and iPhone, on changing worlds) walk in Chromium and Safari's engine: 40 fixed walks
# (3 per push) and their found ones (FOUND_CLICKS), then new ones. A failure names its case: KONTOR_FUZZ_SEED=<number> runs
# it again. Only the random tests; the rest of a version is checked by its push run (tests.yml). About 3 hours, well under
# the user's limit of 5; red: the next chat fixes it (CLAUDE.md, "Nachtlauf rot").
# The data worlds (tests/data_worlds.py: long names, large amounts, empty and full areas, other currencies, month and year
# ends) go through the whole service -- figures, requests, the assistant; and every page in Chrome, each fixed world in every
# view, new random worlds after them.
on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:                # by hand after a night that did not run (3.17.64-66: the file was invalid, 24.11. had none)

permissions:
  contents: read

jobs:
  fuzz:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240              # the cases stop after KONTOR_FUZZ_MINUTES (plus the fixed ones); this only catches a hang
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: "Buchungsregeln 1 · feste + neue Fälle", tests: tests/test_fuzz.py, fixed: "1000"}
          - {name: "Buchungsregeln 2 · neue Fälle", tests: tests/test_fuzz.py, fixed: "0"}
          - {name: "Buchungsregeln 3 · neue Fälle", tests: tests/test_fuzz.py, fixed: "0"}
          - {name: "Buchungsregeln 4 · neue Fälle", tests: tests/test_fuzz.py, fixed: "0"}
          - {name: "Cashflow · feste + neue Fälle", tests: "tests/test_cashflow.py -k 'not random_plans'", fixed: "1000"}
          - {name: "Planung · feste + neue Fälle", tests: "tests/test_cashflow.py -k random_plans", fixed: "1000"}
          - {name: "Szenarien · feste + neue Fälle", tests: tests/test_scenarios.py, fixed: "1000"}
          - {name: "Welten (Privatpersonen, Firmen, Beteiligungen) · feste + neue Fälle", tests: tests/test_worlds.py, fixed: "1000"}
          - {name: "Regelwelten (Beteiligung, Darlehen, Kontenspiegel) 1 · feste + neue Fälle", tests: tests/test_rule_worlds.py, fixed: "1000"}
          - {name: "Regelwelten (Beteiligung, Darlehen, Kontenspiegel) 2 · neue Fälle", tests: tests/test_rule_worlds.py, fixed: "0"}
          - {name: "Klickpfade (Seiten, Dialoge, Seitenfenster, Bezüge) 1 · feste + neue Fälle", tests: tests/test_clickpaths.py, fixed: "40", browsers: true}
          - {name: "Klickpfade (Seiten, Dialoge, Seitenfenster, Bezüge) 2 · neue Fälle", tests: tests/test_clickpaths.py, fixed: "0", browsers: true}
          - {name: "Datenwelten · Zahlen, Anfragen, Assistent · feste + neue Fälle", tests: "tests/test_data_worlds.py -k 'not Pages'", fixed: "0"}
          - {name: "Datenwelten · Seiten in Chrome · feste + neue Fälle", tests: "tests/test_data_worlds.py -k Pages", fixed: "0", browsers: true, minutes: "150"}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.15"          # Kontor's own Python (Apple's 3.9 only starts the starter)
          activate-environment: true
      - run: uv pip install -q pytest
      - name: "Browsers (the click paths: Chromium and WebKit, Safari’s engine)"
        if: matrix.browsers
        timeout-minutes: 30                 # a stuck mirror must not hang the night
        run: |
          uv pip install -q playwright
          for i in 1 2 3 4; do python -m playwright install --with-deps chromium webkit && break; [ $i = 4 ] && exit 1; sleep 30; done
      - name: Tests
        env:
          KONTOR_FUZZ_SEEDS: ${{ matrix.fixed }}
          KONTOR_CLICK_SEEDS: ${{ matrix.fixed }}
          KONTOR_FUZZ_MINUTES: ${{ matrix.minutes || '170' }}       # the data worlds' pages: their fixed worlds in every view first (~20 min)
          TZ: Europe/Berlin
        run: |
          echo "### ${{ matrix.name }}" >> "$GITHUB_STEP_SUMMARY"
          python -m pytest -q ${{ matrix.tests }}
